name: Build, test, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test
      # Requires two repo secrets once a Supabase project exists (see
      # LAUNCH-BRIEF.md §5 / app/.env.example) — the build stays green
      # without them, since app/src/lib/supabase.js no-ops when unset.
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist

      # Requires two repo secrets, created after the Cloudflare Pages
      # project exists (see LAUNCH-BRIEF.md §10.2 — domain not chosen yet):
      #   CLOUDFLARE_API_TOKEN   — a token scoped to Cloudflare Pages:Edit
      #   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account ID
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=civilizational-curriculum
