<!DOCTYPE html>
<html lang="en" data-theme="codex" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Civilizational Curriculum for Leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========== TOKENS ========== */
:root{
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sp:clamp(1rem,3.5vw,2rem);
  --maxw:1180px;
  --r:3px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="codex"]{
  --ground:#12171C; --surface:#1A2027; --surface2:#232B33;
  --ink:#EDE8DD; --dim:#98A0A8; --faint:#5D666E; --rule:#2B343D;
  --brass:#C9A227; --glow:rgba(201,162,39,.14);
  --a1:#8B6F47;--a2:#6B8E5A;--a3:#A33B32;--a4:#5B7C99;--a5:#B8863B;--a6:#7A6B9A;--a7:#C4703A;--a8:#D4A017;
}
html[data-theme="flash"]{
  --ground:#060A1C; --surface:#0D142F; --surface2:#161F45;
  --ink:#ECEFFC; --dim:#98A2CC; --faint:#5A648F; --rule:#1F2856;
  --brass:#7873F5; --glow:rgba(120,115,245,.18);
  --a1:#FF6EC4;--a2:#D96BDA;--a3:#B26CEB;--a4:#9070F3;--a5:#6E72EE;--a6:#4E63DE;--a7:#2F4BD0;--a8:#0924BF;
}
html[data-theme="ledger"]{
  --ground:#090909; --surface:#131313; --surface2:#1D1D1D;
  --ink:#F4F1EB; --dim:#8E8A83; --faint:#57544F; --rule:#272727;
  --brass:#F7931A; --glow:rgba(247,147,26,.15);
  --a1:#6B4423;--a2:#8A5A2B;--a3:#A66F32;--a4:#C2853A;--a5:#D69A2E;--a6:#E8A317;--a7:#F7931A;--a8:#FFC021;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease),color .5s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

/* ========== HEADER ========== */
.hdr{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule);
}
.hdr-in{display:flex;align-items:center;gap:1rem;height:56px;max-width:var(--maxw);margin:0 auto;padding:0 var(--sp)}
.mark{display:flex;align-items:baseline;gap:.5rem;font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:-.01em}
.mark b{display:inline-block;width:9px;height:9px;background:var(--brass);border-radius:1px;transform:translateY(-1px)}
.hdr-sp{flex:1}
.ctrl{display:flex;gap:2px;border:1px solid var(--rule);border-radius:var(--r);padding:2px;background:var(--surface)}
.ctrl button{
  font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.34rem .5rem;border-radius:2px;color:var(--dim);white-space:nowrap;
  transition:background .2s,color .2s;
}
.ctrl button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.ctrl button:hover{color:var(--ink)}
.swatch{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:.32rem;border:1px solid rgba(255,255,255,.2)}
@media(max-width:620px){
  .hdr-in{gap:.55rem}
  .mark span{display:none}
  #themes button{padding:.34rem .42rem}
  #themes .tname{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .swatch{margin-right:0;width:13px;height:13px}
}

/* ========== TAB BAR ========== */
.tabbar{border-top:1px solid var(--rule)}
.tabbar-in{display:flex;gap:0;max-width:var(--maxw);margin:0 auto;padding:0 var(--sp)}
.tabbar button{
  padding:.75rem 0;margin-right:1.7rem;font-size:.88rem;font-weight:500;color:var(--dim);
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
}
.tabbar button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tabbar button:hover{color:var(--ink)}

/* ========== CALENDAR: SETUP ========== */
.calhead{padding:clamp(2.2rem,6vw,3.6rem) 0 1.6rem}
.calhead h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.8rem,4.8vw,2.9rem);line-height:1.06;letter-spacing:-.025em;margin:.55rem 0 0;max-width:18ch}
.calhead p{color:var(--dim);font-size:.95rem;line-height:1.65;max-width:56ch;margin:1rem 0 0}
.setup{display:flex;flex-direction:column;gap:1.7rem;padding:1.6rem 0 2.4rem;max-width:640px}
.fld .eyebrow{display:block;margin-bottom:.6rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{
  padding:.6rem 1rem;border:1px solid var(--rule);border-radius:var(--r);
  font-size:.85rem;font-weight:500;color:var(--dim);transition:all .2s;
}
.opt:hover{border-color:var(--dim);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--ground);font-weight:600}
input[type="date"]{
  font-family:var(--f-mono);font-size:.85rem;padding:.6rem .8rem;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);color-scheme:dark;
}
.cta{
  align-self:flex-start;padding:.75rem 1.5rem;border-radius:var(--r);
  background:var(--brass);color:var(--ground);font-weight:600;font-size:.9rem;
}
.cta:hover{filter:brightness(1.1)}
.warn{font-size:.82rem;color:var(--a3);line-height:1.5;max-width:52ch}

/* ========== CALENDAR: SUMMARY ========== */
.calsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin:1.5rem 0}
.calsum > div{background:var(--ground);padding:.95rem 1rem}
.calsum .k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.calsum .v{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin-top:.32rem;letter-spacing:-.015em}
.calsum .v small{font-size:.62em;color:var(--dim);font-weight:400}
.pill{display:inline-block;padding:.14rem .45rem;border-radius:99px;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.05em}
.pill.ok{background:color-mix(in srgb,var(--a2) 25%,transparent);color:var(--a2)}
.pill.bad{background:color-mix(in srgb,var(--a3) 25%,transparent);color:var(--a3)}

/* ========== CALENDAR: GRID ========== */
.calnav{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:2rem 0 .9rem}
.calnav .mo{font-family:var(--f-display);font-weight:600;font-size:1.28rem;letter-spacing:-.015em;min-width:9ch}
.nav-b{width:32px;height:32px;border:1px solid var(--rule);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.nav-b:hover{border-color:var(--brass);color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.dow{background:var(--surface);padding:.45rem .3rem;text-align:center;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.day{background:var(--ground);min-height:86px;padding:.4rem .45rem;text-align:left;display:flex;flex-direction:column;gap:.22rem;position:relative;transition:background .18s}
.day.out{opacity:.25}
.day.has:hover{background:var(--surface)}
.day .dn{font-family:var(--f-mono);font-size:.62rem;color:var(--faint)}
.day.today .dn{color:var(--brass);font-weight:600}
.day.today{box-shadow:inset 0 0 0 1px var(--brass)}
.day .chip{font-size:.6rem;line-height:1.22;color:var(--ink);border-left:2px solid var(--c);padding-left:.3rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.day .dh{margin-top:auto;font-family:var(--f-mono);font-size:.56rem;color:var(--faint)}
.day[data-done="true"]{background:color-mix(in srgb,var(--a2) 11%,var(--ground))}
.day[data-done="true"]::after{content:"✓";position:absolute;top:.3rem;right:.42rem;font-size:.62rem;color:var(--a2)}
.day .dot{display:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
@media(max-width:640px){
  .day{min-height:52px;align-items:flex-start}
  .day .chip{display:none}
  .day .dot{display:block}
  .day .dh{font-size:.52rem}
}

/* ========== CALENDAR: AGENDA ========== */
.agenda{margin-top:2.2rem}
.agenda h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0 0 .8rem;letter-spacing:-.015em}
.arow{display:grid;grid-template-columns:5.4rem 1fr auto;gap:.4rem 1rem;align-items:center;width:100%;text-align:left;
  padding:.75rem .2rem;border-bottom:1px solid var(--rule);transition:background .18s,padding-left .18s}
.arow:hover{background:var(--surface);padding-left:.6rem}
.arow .ad{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.arow .at{font-size:.88rem;line-height:1.35;border-left:2px solid var(--c);padding-left:.55rem}
.arow .ah{font-family:var(--f-mono);font-size:.64rem;color:var(--faint);white-space:nowrap}
.arow[data-done="true"] .at{opacity:.45}
.arow[data-done="true"] .ad::after{content:" ✓";color:var(--a2)}
@media(max-width:560px){.arow{grid-template-columns:4.6rem 1fr}.arow .ah{grid-column:2;padding-left:.55rem}}

/* ========== DAY SHEET ========== */
.dpart{padding:.9rem 0;border-bottom:1px solid var(--rule)}
.dpart:last-of-type{border-bottom:none}
.dpart .dt{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.2;letter-spacing:-.012em}
.dpart .da{font-size:.76rem;color:var(--dim);margin-top:.15rem}
.dpart .dr{font-family:var(--f-mono);font-size:.64rem;color:var(--c);margin-top:.4rem}
.dpart .prg{height:4px;border-radius:99px;background:var(--surface2);margin-top:.45rem;overflow:hidden;max-width:220px}
.dpart .prg i{display:block;height:100%;background:var(--c);margin-left:var(--o,0%);width:var(--w,0%)}

/* ========== HERO ========== */
.hero{padding:clamp(2.6rem,8vw,5.2rem) 0 clamp(1.6rem,4vw,2.6rem);border-bottom:1px solid var(--rule)}
.hero h1{
  font-family:var(--f-display);font-weight:600;
  font-size:clamp(2.1rem,6.4vw,4.15rem);line-height:1.02;letter-spacing:-.028em;
  margin:.7rem 0 0;max-width:16ch;
  font-variation-settings:"opsz" 144;
}
.hero .sub{
  font-family:var(--f-display);font-weight:400;font-style:italic;
  font-size:clamp(1rem,2.2vw,1.32rem);color:var(--dim);
  margin:.9rem 0 0;max-width:44ch;line-height:1.34;
}
.hero .lede{margin:1.7rem 0 0;max-width:60ch;color:var(--dim);font-size:.97rem;line-height:1.68}
.hero .lede em{color:var(--ink);font-style:normal}

.stats{display:flex;flex-wrap:wrap;gap:0;margin:2.4rem 0 0;border-top:1px solid var(--rule)}
.stat{flex:1 1 120px;padding:1rem 1.2rem 1rem 0;border-right:1px solid var(--rule)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--f-display);font-weight:600;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1;letter-spacing:-.02em}
.stat .n small{font-size:.5em;font-weight:400;color:var(--dim);margin-left:.15em}
.stat .l{margin-top:.42rem}

/* ========== VIEW SWITCH ========== */
.switch{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1.5rem 0 .3rem}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{
  padding:.55rem 1rem;font-size:.8rem;font-weight:500;color:var(--dim);
  transition:background .25s,color .25s;position:relative;
}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--ground);font-weight:600}
.seg button:not([aria-pressed="true"]):hover{background:var(--surface)}
.hint{font-size:.78rem;color:var(--faint);max-width:38ch;line-height:1.45}

/* ========== OVERALL PROGRESS ========== */
.overall{padding:.4rem 0 1.7rem}
.overall-hd{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.6rem;flex-wrap:wrap}
.overall-hd .big{font-family:var(--f-display);font-weight:600;font-size:clamp(1.05rem,2.4vw,1.32rem);letter-spacing:-.015em}
.overall-hd .big b{color:var(--brass);font-weight:600}
.overall-hd .big span{color:var(--dim);font-weight:400}
.obar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface);border:1px solid var(--rule)}
.oseg{position:relative;height:100%;min-width:2px;background:color-mix(in srgb,var(--c) 20%,transparent);
  border-right:1px solid var(--ground);transition:flex-basis .7s var(--ease)}
.oseg:last-child{border-right:none}
.oseg i{position:absolute;left:0;top:0;bottom:0;width:var(--f,0%);background:var(--c);transition:width .55s var(--ease)}
.olegend{display:flex;justify-content:space-between;margin-top:.5rem;gap:1rem}
.olegend .linkbtn{margin-left:auto}
.linkbtn{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);padding-bottom:1px}
.linkbtn:hover{color:var(--ink);border-color:var(--brass)}

/* ========== MAIN COLUMN ========== */
.grid{padding:0 0 4rem}

/* ========== SECTION CARDS ========== */
.cards{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.card{
  display:grid;grid-template-columns:2.6rem 1fr auto;gap:.5rem 1rem;align-items:baseline;
  padding:1.15rem .2rem;text-align:left;width:100%;
  border-bottom:1px solid var(--rule);
  transition:background .22s,padding-left .22s;
}
.card:hover,.card:focus-visible{background:var(--surface);padding-left:.7rem}
.card .cn{font-family:var(--f-mono);font-size:.72rem;color:var(--c);letter-spacing:.05em}
.card .ct{font-family:var(--f-display);font-weight:600;font-size:clamp(1.02rem,2.1vw,1.3rem);line-height:1.2;letter-spacing:-.015em}
.card .ca{font-size:.76rem;color:var(--dim);margin-top:.26rem}
.card .cd{grid-column:2;font-size:.87rem;color:var(--dim);line-height:1.5;margin-top:.5rem;max-width:56ch}
.card .cbar{grid-column:2;display:flex;align-items:center;gap:.75rem;margin-top:.85rem;max-width:640px}
.card .crail{display:block;flex:1 1 auto;min-width:0}
.card .ctrack{
  display:block;height:6px;border-radius:99px;overflow:hidden;
  width:var(--w,100%);min-width:14px;
  background:color-mix(in srgb,var(--c) 17%,transparent);
}
.card .ctrack i{display:block;height:100%;width:var(--f,0%);background:var(--c);transition:width .55s var(--ease)}
.card .cpct{flex:0 0 auto;font-family:var(--f-mono);font-size:.62rem;color:var(--faint);white-space:nowrap}
.card .cpct b{color:var(--c);font-weight:500}
.card .cm{text-align:right;font-family:var(--f-mono);font-size:.68rem;color:var(--dim);white-space:nowrap;line-height:1.5}
.card .cm b{color:var(--ink);font-weight:500}
@media(max-width:560px){
  .card{grid-template-columns:2.2rem 1fr}
  .card .cm{grid-column:2;text-align:left;margin-top:.5rem}
  .card .cd{margin-top:.4rem}
  .card .cbar{margin-top:.7rem}
}

/* ========== SECTION VIEW ========== */
.view{padding:1.8rem 0 4rem;animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:.4rem 0}
.back:hover{color:var(--brass)}
.shd{border-bottom:1px solid var(--rule);padding-bottom:1.6rem;margin-bottom:1.9rem}
.shd .num{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--c)}
.shd h2{
  font-family:var(--f-display);font-weight:600;font-size:clamp(1.7rem,4.6vw,3rem);
  line-height:1.06;letter-spacing:-.025em;margin:.55rem 0 0;max-width:20ch;
}
.shd .anchor{font-family:var(--f-display);font-style:italic;font-size:1.02rem;color:var(--dim);margin-top:.6rem}
.shd .meter{display:flex;align-items:center;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.shd .meter .tick{height:5px;flex:1;min-width:120px;background:var(--surface2);border-radius:99px;overflow:hidden}
.shd .meter .tick i{display:block;height:100%;background:var(--c);width:var(--w,0%);transition:width .6s var(--ease)}
.shd .meter .lbl{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.prose{max-width:64ch;color:var(--dim);font-size:.97rem;line-height:1.72;margin-bottom:2.2rem}

/* ========== BOOK LIST ========== */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.bk{
  display:flex;flex-direction:column;gap:.5rem;text-align:left;
  background:var(--ground);padding:1.05rem 1rem 1.1rem;min-height:186px;
  transition:background .22s;position:relative;
}
.bk:hover,.bk:focus-visible{background:var(--surface)}
.bk .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.bk .idx{font-family:var(--f-mono);font-size:.66rem;color:var(--c);letter-spacing:.05em}
.bk .hrs{font-family:var(--f-mono);font-size:.63rem;color:var(--faint);white-space:nowrap}
.bk h3{font-family:var(--f-display);font-weight:600;font-size:1.03rem;line-height:1.22;margin:0;letter-spacing:-.012em}
.bk .au{font-size:.78rem;color:var(--dim);margin-top:-.16rem}
.bk .sb{font-size:.71rem;color:var(--faint);font-style:italic}
.bk .foot{margin-top:auto;padding-top:.7rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.57rem;letter-spacing:.07em;text-transform:uppercase;padding:.16rem .38rem;border-radius:2px;border:1px solid var(--rule);color:var(--faint)}
.tag.fr-yes{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.tag.fr-maybe{color:var(--dim)}
.tag.ph{color:var(--dim)}
.bk .done{position:absolute;top:.85rem;right:.9rem;width:15px;height:15px;border-radius:50%;background:var(--c);display:none;align-items:center;justify-content:center}
.bk[data-read="true"] .done{display:flex}
.bk[data-read="true"] h3{opacity:.55}
.bk[data-read="true"] .au{opacity:.5}
.bk .done svg{width:9px;height:9px;stroke:var(--ground);stroke-width:2.6;fill:none}

/* ordered reading sequence (phase view) */
.seqhd{display:flex;align-items:baseline;gap:.7rem;margin:0 0 .7rem}
.seq{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.srow{
  display:grid;grid-template-columns:2.4rem 1fr auto;gap:.35rem 1rem;align-items:center;
  padding:.9rem 1.05rem;text-align:left;width:100%;background:var(--ground);
  border-bottom:1px solid var(--rule);transition:background .2s,padding-left .2s;position:relative;
}
.srow:last-child{border-bottom:none}
.srow:hover,.srow:focus-visible{background:var(--surface);padding-left:1.35rem}
.srow .sn{font-family:var(--f-mono);font-size:.75rem;color:var(--c);align-self:start;padding-top:.15rem}
.srow .st{font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.22;letter-spacing:-.012em}
.srow .sa{font-size:.76rem;color:var(--dim);margin-top:.12rem}

      fr: "À lire avec Clausewitz. Keegan l'attaque délibérément, et la lecture que Keegan fait de Clausewitz a elle-même été contestée. La valeur est dans la confrontation : Clausewitz relie l'action militaire aux objectifs politiques ; Keegan montre la violence échappant au contrôle rationnel."
    } },
  { n: 15, s: "war", ph: 3, ord: 5, h: [16, 21],
    title: "The Early History of Rome", author: "Livy", year: -27, sub: "Books 1–5",
    titleFr: "Histoire romaine, livres I–V", fr: "published",
    note: {
      en: "Founding myths, monarchy, the establishment of the Republic, class conflict, civic religion and early military struggle. The line between myth and documented history is often uncertain — and that uncertainty is itself useful. Founding stories reveal what a civilization believes about itself: the virtues it rewards, the crimes it fears, and the legitimacy it claims for its institutions.",
      fr: "Mythes fondateurs, monarchie, établissement de la République, conflits de classes, religion civique et premières luttes militaires. La frontière entre mythe et histoire documentée est souvent incertaine — et cette incertitude est elle-même utile. Les récits de fondation révèlent ce qu'une civilisation croit d'elle-même : les vertus qu'elle récompense, les crimes qu'elle redoute et la légitimité qu'elle revendique pour ses institutions."
    } },
  { n: 16, s: "war", ph: 3, ord: 6, h: [12, 16],
    title: "Rome and Italy", author: "Livy", year: -27, sub: "Books 6–10",
    titleFr: "Histoire romaine, livres VI–X", fr: "published",
    note: {
      en: "Institutional endurance, internal conflict, military adaptation and the consolidation of Italy. Rome's strength did not come from uninterrupted victory. It came from defeat, adaptation, alliance-building, discipline, and the ability to absorb other communities into differentiated systems of citizenship and obligation. Institutions can grow stronger through adversity — provided failure produces adaptation rather than denial.",
      fr: "Endurance institutionnelle, conflit interne, adaptation militaire et consolidation de l'Italie. La force de Rome n'est pas venue d'une victoire ininterrompue. Elle est venue de la défaite, de l'adaptation, de la construction d'alliances, de la discipline et de la capacité à absorber d'autres communautés dans des systèmes différenciés de citoyenneté et d'obligation. Les institutions peuvent se renforcer par l'adversité — à condition que l'échec produise de l'adaptation plutôt que du déni."
    } },
  { n: 17, s: "war", ph: 3, ord: 7, h: [23, 30],
    title: "The War with Hannibal", author: "Livy", year: -27, sub: "Books 21–30",
    titleFr: "Histoire romaine, livres XXI–XXX", fr: "published",
    note: {
      en: "One of history's great studies of strategy, leadership, logistics, resilience and survival after repeated catastrophe. Hannibal beat Roman armies again and again and threatened the Republic's existence. Rome survived because its political system, manpower, alliance structure, strategic depth and willingness to absorb losses exceeded what tactical brilliance alone could overcome. Required reading for anyone running an institution that must survive extreme stress.",
      fr: "L'une des grandes études de l'histoire sur la stratégie, le commandement, la logistique, la résilience et la survie après des catastrophes répétées. Hannibal a battu les armées romaines encore et encore et menacé l'existence même de la République. Rome a survécu parce que son système politique, ses effectifs, sa structure d'alliances, sa profondeur stratégique et sa capacité à absorber les pertes dépassaient ce que le seul génie tactique pouvait emporter. Lecture obligatoire pour qui dirige une institution devant survivre à un stress extrême."
    } },
  { n: 18, s: "war", ph: 3, ord: 8, h: [22, 29],
    title: "Rome and the Mediterranean", author: "Livy", year: -27, sub: "Books 31–45",
    titleFr: "Histoire romaine, livres XXXI–XLV", fr: "published",
    note: {
      en: "Diplomacy, territorial expansion, great-power rivalry and Rome's growing domination of the Mediterranean. Victory creates its own dangers. Foreign wealth, provincial administration, military prestige and political ambition alter the incentives of republican institutions. A political system can be transformed by success long before its constitution formally changes.",
      fr: "Diplomatie, expansion territoriale, rivalité entre grandes puissances et domination croissante de Rome sur la Méditerranée. La victoire crée ses propres dangers. La richesse étrangère, l'administration provinciale, le prestige militaire et l'ambition politique modifient les incitations des institutions républicaines. Un système politique peut être transformé par le succès bien avant que sa constitution ne change formellement."
    } },

  /* ---------- IV. Uncertainty ---------- */
  { n: 19, s: "uncertainty", ph: 1, ord: 2, h: [10, 13],
    title: "Fooled by Randomness", author: "Nassim Nicholas Taleb", year: 2001,
    titleFr: "Le hasard sauvage", fr: "published",
    note: {
      en: "How to tell skill from luck. Success produces stories: survivors explain why they prevailed while failures vanish from the sample, and the resulting narratives systematically overstate foresight, talent and control. Read it to recognise survivorship bias, selection effects, the narrative fallacy, and the human urge to extract certainty from noise.",
      fr: "Comment distinguer la compétence de la chance. Le succès produit des récits : les survivants expliquent pourquoi ils l'ont emporté tandis que les échecs disparaissent de l'échantillon, et les récits qui en résultent surestiment systématiquement la clairvoyance, le talent et le contrôle. À lire pour repérer le biais du survivant, les effets de sélection, le sophisme narratif et la pulsion humaine à extraire de la certitude du bruit."
    } },
  { n: 20, s: "uncertainty", ph: 1, ord: 3, h: [14, 17],
    title: "The Black Swan", author: "Nassim Nicholas Taleb", year: 2007,
    titleFr: "Le cygne noir", fr: "published",
    note: {
      en: "Why rare, consequential events dominate history even though conventional models ignore them. After an extreme event, institutions construct explanations that make it look predictable; before it, the same institutions assign it negligible probability. The absence of prior evidence is not evidence of impossibility. Design around the consequences of being wrong, not merely the probability that you are right.",
      fr: "Pourquoi des événements rares et lourds de conséquences dominent l'histoire alors même que les modèles conventionnels les ignorent. Après un événement extrême, les institutions construisent des explications qui le font paraître prévisible ; avant, ces mêmes institutions lui assignaient une probabilité négligeable. L'absence de preuve antérieure n'est pas une preuve d'impossibilité. Concevez en fonction des conséquences d'avoir tort, et non seulement de la probabilité d'avoir raison."
    } },
  { n: 21, s: "uncertainty", ph: 7, ord: 1, h: [5, 8],
    title: "The Bed of Procrustes", author: "Nassim Nicholas Taleb", year: 2010,
    titleFr: "Le lit de Procuste", fr: "published",
    note: {
      en: "The title refers to the figure who forced travellers to fit his bed by stretching or amputating them. Taleb uses it for institutions that mutilate reality until it fits a theory, metric, model, mandate or ideology. Best read slowly; the aphorisms become more useful as you accumulate real-world experience.",
      fr: "Le titre renvoie au personnage qui forçait les voyageurs à s'ajuster à son lit en les étirant ou en les amputant. Taleb l'applique aux institutions qui mutilent le réel jusqu'à ce qu'il entre dans une théorie, un indicateur, un modèle, un mandat ou une idéologie. À lire lentement ; les aphorismes gagnent en utilité à mesure que l'expérience du terrain s'accumule."
    } },
  { n: 22, s: "uncertainty", ph: 2, ord: 3, h: [16, 20],
    title: "Antifragile", author: "Nassim Nicholas Taleb", year: 2012,
    titleFr: "Antifragile", fr: "published",
    note: {
      en: "Resilience means surviving disorder. Antifragility means improving because of it. This is where Taleb moves from prediction to design — systems that benefit from variation, redundancy, decentralisation, stress, experimentation and small failures. Highly optimised systems look efficient until a shock reveals that all their slack has been removed. Efficiency without survivability is hidden fragility.",
      fr: "La résilience, c'est survivre au désordre. L'antifragilité, c'est s'améliorer grâce à lui. C'est ici que Taleb passe de la prédiction à la conception — des systèmes qui tirent parti de la variation, de la redondance, de la décentralisation, du stress, de l'expérimentation et des petits échecs. Les systèmes très optimisés paraissent efficaces jusqu'à ce qu'un choc révèle qu'on leur a retiré toute marge. L'efficacité sans capacité de survie est une fragilité cachée."
    } },
  { n: 23, s: "uncertainty", ph: 2, ord: 4, h: [9, 11],
    title: "Skin in the Game", author: "Nassim Nicholas Taleb", year: 2018,
    titleFr: "Jouer sa peau", fr: "published",
    note: {
      en: "Anyone who exercises authority, gives advice, designs policy or imposes risk should share exposure to the consequences. This is not only an ethical preference but an information mechanism: people decide differently when failure has personal cost. Systems become dangerous when decision-makers capture the upside and transfer the downside to others.",
      fr: "Quiconque exerce une autorité, donne un conseil, conçoit une politique ou impose un risque devrait partager l'exposition aux conséquences. Ce n'est pas seulement une préférence éthique, c'est un mécanisme d'information : on décide autrement quand l'échec a un coût personnel. Les systèmes deviennent dangereux quand les décideurs captent le gain et transfèrent la perte aux autres."
    } },

  /* ---------- V. Liberty ---------- */
  { n: 24, s: "liberty", ph: 2, ord: 1, h: [65, 80],
    title: "Man, Economy, and State, with Power and Market", author: "Murray Rothbard", year: 1962,
    titleFr: "L'homme, l'économie et l'État", fr: "unverified",
    note: {
      en: "The theoretical foundation. Rothbard starts from purposeful human action and builds a systematic account of value, exchange, prices, production, capital, interest, money, banking, monopoly, business cycles and government intervention. Power and Market extends it to taxation, regulation, price controls, monopoly grants and subsidies. The central lesson: a rule does not abolish the incentives or the scarcity it ignores — it redirects behaviour into evasion, substitution, black markets, corruption or failure.",
      fr: "La fondation théorique. Rothbard part de l'action humaine intentionnelle et construit un exposé systématique de la valeur, de l'échange, des prix, de la production, du capital, de l'intérêt, de la monnaie, de la banque, du monopole, des cycles économiques et de l'intervention publique. Power and Market étend l'analyse à la fiscalité, à la réglementation, au contrôle des prix, aux concessions de monopole et aux subventions. La leçon centrale : une règle n'abolit pas les incitations ni la rareté qu'elle ignore — elle redirige les comportements vers le contournement, la substitution, le marché noir, la corruption ou l'échec."
    } },
  { n: 25, s: "liberty", ph: 2, ord: 2, h: [16, 20],
    title: "The Ethics of Liberty", author: "Murray Rothbard", year: 1982,
    titleFr: "L'éthique de la liberté", fr: "published",
    note: {
      en: "A normative framework built on self-ownership, property, consent, natural law, coercion, punishment and political authority. Economic efficiency alone cannot settle whether an action is just. The book forces you to identify the moral assumptions hidden inside political and economic arguments.",
      fr: "Un cadre normatif fondé sur la propriété de soi, la propriété, le consentement, le droit naturel, la contrainte, la punition et l'autorité politique. L'efficacité économique seule ne peut trancher la justice d'une action. Le livre oblige à identifier les présupposés moraux dissimulés dans les arguments politiques et économiques."
    } },
  { n: 26, s: "liberty", ph: 4, ord: 1, h: [21, 27],
    title: "Economic Thought Before Adam Smith", author: "Murray Rothbard", year: 1995, sub: "An Austrian Perspective, Vol. I",
    titleFr: null, fr: "none",
    note: {
      en: "Ancient thought, medieval scholasticism, natural law, the Spanish scholastics, French economics, and the development of ideas about value, exchange, property, money and interest. It challenges the conventional story that economics began in recognisable form with Adam Smith and British classical economics. Read it as intellectual history and as revisionism at the same time.",
      fr: "Pensée antique, scolastique médiévale, droit naturel, scolastiques espagnols, économie française, et développement des idées sur la valeur, l'échange, la propriété, la monnaie et l'intérêt. L'ouvrage conteste le récit conventionnel selon lequel l'économie serait née sous une forme reconnaissable avec Adam Smith et l'école classique britannique. À lire comme histoire des idées et comme révisionnisme à la fois."
    } },
  { n: 27, s: "liberty", ph: 4, ord: 2, h: [20, 26],
    title: "Classical Economics", author: "Murray Rothbard", year: 1995, sub: "An Austrian Perspective, Vol. II",
    titleFr: null, fr: "none",
    note: {
      en: "British classical economics, French liberalism, Marxism, utilitarianism, monetary debates and nineteenth-century political economy. Rothbard is sharpest against theoretical systems that replace subjective value and individual action with aggregates and mechanistic models. For anyone interested in Bitcoin, the two volumes supply the context for recurring arguments about sound money, monetary sovereignty, banking privilege, inflation and state power.",
      fr: "Économie classique britannique, libéralisme français, marxisme, utilitarisme, débats monétaires et économie politique du XIXᵉ siècle. Rothbard est le plus incisif contre les systèmes théoriques qui remplacent la valeur subjective et l'action individuelle par des agrégats et des modèles mécanistes. Pour qui s'intéresse au Bitcoin, ces deux volumes fournissent le contexte des débats récurrents sur la monnaie saine, la souveraineté monétaire, le privilège bancaire, l'inflation et le pouvoir de l'État."
    } },
  { n: 28, s: "liberty", ph: 4, ord: 3, h: [18, 22],
    title: "Conceived in Liberty, Vol. I", author: "Murray Rothbard", year: 1975,
    titleFr: null, fr: "none",
    note: {
      en: "Colonial origins and the competing systems of settlement, religion, property, political control and local autonomy. The colonies did not emerge from one coherent project but from conflicting commercial, religious, imperial and local arrangements. Initial rules governing property and authority can shape political culture for centuries.",
      fr: "Les origines coloniales et les systèmes concurrents de peuplement, de religion, de propriété, de contrôle politique et d'autonomie locale. Les colonies ne sont pas nées d'un projet cohérent unique mais d'arrangements commerciaux, religieux, impériaux et locaux contradictoires. Les règles initiales qui régissent la propriété et l'autorité peuvent façonner une culture politique pendant des siècles."
    } },
  { n: 29, s: "liberty", ph: 4, ord: 4, h: [10, 13],
    title: "Conceived in Liberty, Vol. II", author: "Murray Rothbard", year: 1975,
    titleFr: null, fr: "none",
    note: {
      en: "Colonial society during a period of relative imperial neglect. Local institutions, commerce and traditions of self-government developed partly because distant authority lacked the ability or the incentive to exercise constant control. Liberty often emerges not from centralised design but from spaces where centralised power is absent, divided, constrained or inattentive.",
      fr: "La société coloniale pendant une période de relative négligence impériale. Les institutions locales, le commerce et les traditions d'autogouvernement se sont développés en partie parce que l'autorité lointaine n'avait ni les moyens ni l'intérêt d'exercer un contrôle constant. La liberté émerge souvent non d'une conception centralisée mais d'espaces où le pouvoir centralisé est absent, divisé, contraint ou inattentif."
    } },
  { n: 30, s: "liberty", ph: 4, ord: 5, h: [12, 16],
    title: "Conceived in Liberty, Vol. III", author: "Murray Rothbard", year: 1976,
    titleFr: null, fr: "none",
    note: {
      en: "The imperial crisis and the road to the American Revolution. Taxes, trade restrictions, military occupation, constitutional argument and competing theories of sovereignty turned administrative disputes into a struggle over first principles. A conflict over policy becomes revolutionary when institutions lose the ability to settle disagreement without escalating coercion.",
      fr: "La crise impériale et le chemin vers la Révolution américaine. Impôts, restrictions commerciales, occupation militaire, argumentation constitutionnelle et théories concurrentes de la souveraineté ont transformé des différends administratifs en lutte sur les premiers principes. Un conflit de politique devient révolutionnaire quand les institutions perdent la capacité de trancher un désaccord sans escalade de la contrainte."
    } },
  { n: 31, s: "liberty", ph: 4, ord: 6, h: [16, 21],
    title: "Conceived in Liberty, Vol. IV", author: "Murray Rothbard", year: 1979,
    titleFr: null, fr: "none",
    note: {
      en: "Revolution, war, independence, and the problem of preserving liberty during a national emergency. Wars for freedom often centralise the very powers they were fought against: governments demand revenue, conscription, regulation, secrecy and executive authority in the name of survival. The tension between liberty and mobilisation is permanent.",
      fr: "Révolution, guerre, indépendance et problème de la préservation de la liberté en situation d'urgence nationale. Les guerres pour la liberté centralisent souvent les pouvoirs mêmes qu'elles combattaient : les gouvernements exigent des recettes, la conscription, la réglementation, le secret et l'autorité exécutive au nom de la survie. La tension entre liberté et mobilisation est permanente."
    } },
  { n: 32, s: "liberty", ph: 4, ord: 7, h: [11, 14],
    title: "Conceived in Liberty, Vol. V", author: "Murray Rothbard", year: 2019, sub: "The New Republic, 1784–1791",
    titleFr: null, fr: "none",
    note: {
      en: "The postwar republic, the Constitution, centralisation and the Washington administration. It raises the foundational political question: how much centralised capacity is necessary to preserve order, and how much eventually threatens the liberty it was created to protect?",
      fr: "La république d'après-guerre, la Constitution, la centralisation et l'administration Washington. Le volume pose la question politique fondamentale : quelle capacité centralisée est nécessaire pour préserver l'ordre, et à partir de quel point menace-t-elle la liberté qu'elle devait protéger ?"
    } },

  /* ---------- VI. Capital ---------- */
  { n: 33, s: "capital", ph: 5, ord: 1, h: [24, 31],
    title: "Titan", author: "Ron Chernow", year: 1998, sub: "The Life of John D. Rockefeller, Sr.",
    titleFr: null, fr: "none",
    note: {
      en: "Rockefeller and the building of Standard Oil — industrial scale, vertical integration, operational discipline, logistics, accounting, pricing, competition, monopoly, reputation, philanthropy and public legitimacy. Rockefeller did not merely accumulate assets; he built an integrated system that cut costs, imposed standards, coordinated infrastructure and outlasted competitors. The same discipline that produced extraordinary efficiency produced extraordinary concentration of power.",
      fr: "Rockefeller et la construction de la Standard Oil — échelle industrielle, intégration verticale, discipline opérationnelle, logistique, comptabilité, tarification, concurrence, monopole, réputation, philanthropie et légitimité publique. Rockefeller n'a pas seulement accumulé des actifs ; il a bâti un système intégré qui réduisait les coûts, imposait des standards, coordonnait les infrastructures et survivait à ses concurrents. La discipline même qui a produit une efficacité extraordinaire a produit une concentration de pouvoir extraordinaire."
    } },
  { n: 34, s: "capital", ph: 5, ord: 2, h: [24, 31],
    title: "The House of Morgan", author: "Ron Chernow", year: 1990,
    titleFr: null, fr: "none",
    note: {
      en: "The Morgan banking dynasty and the making of modern finance — the relationships between banks, corporations, governments, markets, central banks, wars, regulation and financial crises. The House of Morgan operated on the boundary between private institution and public utility, and its influence rested not only on capital but on trust, networks, information, discretion and reputation built across generations. The lives are interesting; the institutions matter more.",
      fr: "La dynastie bancaire Morgan et la fabrique de la finance moderne — les relations entre banques, entreprises, gouvernements, marchés, banques centrales, guerres, réglementation et crises financières. La maison Morgan opérait à la frontière entre institution privée et service public, et son influence reposait non seulement sur le capital mais sur la confiance, les réseaux, l'information, la discrétion et une réputation bâtie sur plusieurs générations. Les vies sont intéressantes ; les institutions comptent davantage."
    } },

  /* ---------- VII. Energy ---------- */
  { n: 35, s: "energy", ph: 5, ord: 3, h: [27, 36],
    title: "The Prize", author: "Daniel Yergin", year: 1991, sub: "The Epic Quest for Oil, Money and Power",
    titleFr: "Les hommes du pétrole", fr: "unverified",
    note: {
      en: "The history of oil and its entanglement with industrialisation, transport, warfare, national power and the world economy. Underneath the narrative sits a harder claim: modern civilization runs on energy abundance. Oil rewrote geography and geopolitics, creating corporations, reshaping military strategy, elevating some states and hollowing out others. Every financial and digital system remains grounded in the physical world — money coordinates claims on resources, and energy is what makes resources useful.",
      fr: "L'histoire du pétrole et son enchevêtrement avec l'industrialisation, les transports, la guerre, la puissance des États et l'économie mondiale. Sous le récit se cache une thèse plus dure : la civilisation moderne repose sur l'abondance énergétique. Le pétrole a réécrit la géographie et la géopolitique, créant des entreprises, redessinant la stratégie militaire, élevant certains États et en vidant d'autres de leur substance. Tout système financier ou numérique reste ancré dans le monde physique — la monnaie coordonne des droits sur des ressources, et c'est l'énergie qui rend ces ressources utiles."
    },
    against: {
      en: "Yergin writes history, not prophecy. Don't mistake the last century of energy for a template for the next.",
      fr: "Yergin écrit de l'histoire, non de la prophétie. Ne confondez pas le siècle énergétique écoulé avec un modèle pour celui qui vient."
    } },
  { n: 36, s: "energy", ph: 1, ord: 4, h: [16, 22],
    title: "The Beginning of Infinity", author: "David Deutsch", year: 2011,
    titleFr: null, fr: "none",
    note: {
      en: "Explanation, criticism, fallibility, knowledge creation, and the conditions under which progress can continue. Problems are inevitable; solutions are not guaranteed — but they keep emerging wherever institutions permit conjecture, experiment, criticism and error correction. Progress is neither automatic nor bounded. It depends on a culture where bad explanations can be challenged and better ones can displace them.",
      fr: "L'explication, la critique, la faillibilité, la création de connaissance et les conditions dans lesquelles le progrès peut se poursuivre. Les problèmes sont inévitables ; les solutions ne sont pas garanties — mais elles continuent d'émerger partout où les institutions autorisent la conjecture, l'expérimentation, la critique et la correction des erreurs. Le progrès n'est ni automatique ni borné. Il dépend d'une culture où les mauvaises explications peuvent être contestées et remplacées par de meilleures."
    },
    against: {
      en: "His optimism is conditional, not assured. It holds only where institutions permit criticism and correction.",
      fr: "Son optimisme est conditionnel, non acquis. Il ne tient que là où les institutions permettent la critique et la correction."
    } },
  { n: 37, s: "energy", ph: 6, ord: 1, h: [9, 12],
    title: "The Mobile Wave", author: "Michael Saylor", year: 2012,
    titleFr: null, fr: "none",
    note: {
      en: "Saylor includes his own book with stated hesitation, for one reason: it is an applied exercise in reasoning from first principles. Written in 2012, it asked what would follow when computing went mobile, software dematerialised products and services, and billions of people gained continuous access to networked intelligence. The wider lesson: digital transformation rarely leaves an institution intact and merely faster. It usually dematerialises the institution, redistributes power, changes the economics, and produces something structurally different.",
      fr: "Saylor inclut son propre livre en s'en excusant, pour une raison précise : c'est un exercice appliqué de raisonnement à partir des premiers principes. Écrit en 2012, il posait la question de ce qui suivrait lorsque l'informatique deviendrait mobile, que le logiciel dématérialiserait produits et services, et que des milliards de personnes accéderaient en continu à une intelligence en réseau. La leçon plus large : une transformation numérique laisse rarement une institution intacte et simplement plus rapide. Le plus souvent, elle la dématérialise, redistribue le pouvoir, en change l'économie et produit autre chose."
    },
    against: {
      en: "Read it as an auditable forecast, not an authority. Ask which predictions held, which were incomplete, which second-order effects were missed, and which analytical methods proved useful. Judge it against the world that actually followed.",
      fr: "Lisez-le comme une prévision auditable, non comme une autorité. Demandez quelles prédictions ont tenu, lesquelles étaient incomplètes, quels effets de second ordre ont été manqués et quelles méthodes d'analyse se sont révélées utiles. Jugez-le à l'aune du monde qui a effectivement suivi."
    } },

  /* ---------- VIII. Money ---------- */
  { n: 38, s: "money", ph: 6, ord: 2, h: [10, 13],
    title: "The Bitcoin Standard", author: "Saifedean Ammous", year: 2018,
    titleFr: "L'étalon Bitcoin", fr: "published",
    note: {
      en: "Bitcoin placed inside the history of monetary technologies — why societies adopted shells, stones, metals, coins, gold, paper claims, government currency and eventually digital money; what properties let a good carry value across time and space; and what happens when a monetary system can be expanded or manipulated by privileged institutions. It then presents Bitcoin as digital hard money: scarce, global, decentralised, and governed by protocol rather than political discretion.",
      fr: "Le Bitcoin replacé dans l'histoire des technologies monétaires — pourquoi les sociétés ont adopté coquillages, pierres, métaux, pièces, or, créances papier, monnaie d'État puis monnaie numérique ; quelles propriétés permettent à un bien de transporter de la valeur dans le temps et l'espace ; et ce qui se produit lorsqu'un système monétaire peut être étendu ou manipulé par des institutions privilégiées. Il présente ensuite le Bitcoin comme une monnaie forte numérique : rare, mondiale, décentralisée, gouvernée par un protocole plutôt que par la discrétion politique."
    },
    against: {
      en: "Its greatest contribution is the monetary framework. Treat its broader cultural conclusions as arguments rather than universal laws, and test the whole against the white paper, the code, the network, monetary history and competing theories of money.",
      fr: "Sa plus grande contribution est le cadre monétaire. Traitez ses conclusions culturelles plus larges comme des arguments et non des lois universelles, et confrontez l'ensemble au livre blanc, au code, au réseau, à l'histoire monétaire et aux théories concurrentes de la monnaie."
    } }
];

const COUNTERWEIGHTS = [
  { id: "cw1", s: "war", ph: 3, ord: 10,

/* groups = the current axis (8 themes or 7 phases) */

      ...(p.reread||[]).map(r=>({item:BOOKS.find(b=>b.n===r.n), ord:r.ord, isCw:false, isReread:true}))
    ].sort((a,b)=>a.ord-b.ord);

      key:p.id, kind:"phase", label:String(p.n), accent:acc,
      title:L(p.title), anchor:"", teaser:L(p.note).split(/(?<=\.)\s/)[0], intro:L(p.note), against:"",

/* ===================================================================
   MODULE: PERSIST
   Uses the artifact key-value store when available, memory otherwise.
   TO DEPLOY AS A NORMAL WEBSITE: replace the two bodies below with
     localStorage.getItem(k) / localStorage.setItem(k, JSON.stringify(v))
   =================================================================== */
const MEM = {};
const Persist = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}
    return MEM[k] ?? null;
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); return; } }catch(e){}
    MEM[k]=v;
  }
};
const KEY="curriculum:v1";
function saveState(){
  Persist.set(KEY,{cfg:S.cfg,done:[...S.done],read:[...S.read],lang:S.lang,theme:S.theme,view:S.view});
}
async function loadState(){
  const d = await Persist.get(KEY); if(!d) return;
  if(d.lang) S.lang=d.lang;
  if(d.view) S.view=d.view;
  if(d.theme){ S.theme=d.theme; document.documentElement.dataset.theme=d.theme;
    [...el("themes").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.t===d.theme)); }
  if(Array.isArray(d.read)) S.read=new Set(d.read);
  if(Array.isArray(d.done)) S.done=new Set(d.done);
  if(d.cfg){ S.cfg=d.cfg; S.draft={...d.cfg}; applySchedule(buildSchedule(d.cfg)); }
}

/* ===================================================================
   MODULE: SCHEDULE  — pure functions, no DOM
   =================================================================== */
const iso     = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = v => { const [y,m,d]=v.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const todayIso= () => iso(new Date());

/* the full curriculum flattened into Saylor's reading order */
function readingLine(){
  const out=[];
  PHASES.forEach(p=>{
    [
      ...BOOKS.filter(b=>b.ph===p.n).map(b=>({kind:"book",   ord:b.ord, n:b.n, hours:b.h[1], s:b.s})),
      ...COUNTERWEIGHTS.filter(c=>c.ph===p.n&&c.ord).map(c=>({kind:"cw", ord:c.ord, id:c.id, hours:0, s:c.s})),
      ...(p.reread||[]).map(r=>{ const b=BOOKS.find(x=>x.n===r.n);
          return {kind:"reread", ord:r.ord, n:b.n, hours:b.h[1], s:b.s}; })
    ].sort((a,b)=>a.ord-b.ord).forEach(it=>out.push({...it, phase:p.n}));
  });
  return out;
}

/* split the reading line into fixed-length sessions, then date them */
function buildSchedule(cfg){
  const per=cfg.hours, sessions=[];
  let cur={parts:[],hours:0};
  const flush=()=>{ if(cur.parts.length){ sessions.push(cur); cur={parts:[],hours:0}; } };

  readingLine().forEach(it=>{
    if(it.hours===0){                                  /* untimed companion text */
      const tgt = cur.parts.length ? cur : (sessions[sessions.length-1] || cur);
      tgt.parts.push({...it, marker:true});
      if(tgt===cur && !sessions.length && !cur.hours) {}
      return;
    }
    let placed=0;
    while(placed<it.hours){
      const take=Math.min(per-cur.hours, it.hours-placed);
      cur.parts.push({...it, from:placed, to:placed+take, take});
      cur.hours+=take; placed+=take;
      if(cur.hours>=per) flush();
    }
  });
  flush();

  let d=fromIso(cfg.start);
  const skipWeekend = () => { while(d.getDay()===0||d.getDay()===6) d=addDays(d,1); };
  if(cfg.cadence==="weekdays") skipWeekend();
  sessions.forEach((ss,i)=>{
    ss.i=i; ss.date=iso(d);
    if(cfg.cadence==="weekly") d=addDays(d,7);
    else { d=addDays(d,1); if(cfg.cadence==="weekdays") skipWeekend(); }
  });
  return sessions;
}

function applySchedule(sched){
  S.sched=sched;
  S.byDate=new Map(sched.map(x=>[x.date,x]));
}
function spanLabel(a,b){
  const T=t(), A=fromIso(a), B=fromIso(b);
  let m=(B.getFullYear()-A.getFullYear())*12+(B.getMonth()-A.getMonth());
  if(B.getDate()<A.getDate()) m--;
  m=Math.max(m,0);
  const y=Math.floor(m/12), mm=m%12;
  return (y?`${y}${T.yearsShort} `:"")+`${mm} ${T.monthsShort}`;
}
function schedStats(sched){
  const total=sched.length;
  const doneN=sched.filter(x=>S.done.has(x.date)).length;
  const hours=sched.reduce((a,x)=>a+x.hours,0);
  const doneH=sched.filter(x=>S.done.has(x.date)).reduce((a,x)=>a+x.hours,0);
  const tI=todayIso();
  const due=sched.filter(x=>x.date<=tI).length;
  return {total,doneN,hours,doneH,due,delta:doneN-due,start:sched[0].date,end:sched[total-1].date};
}

/* ===== progress sync between sessions and books ===== */
function syncBooks(){
  if(!S.sched) return;
  const map=new Map();
  S.sched.forEach(x=>x.parts.forEach(pt=>{
    if(pt.kind!=="book") return;
    if(!map.has(pt.n)) map.set(pt.n,[]);
    map.get(pt.n).push(x.date);
  }));
  map.forEach((dates,n)=>{ dates.every(d=>S.done.has(d)) ? S.read.add(n) : S.read.delete(n); });
}
function setSessionDone(date,on){
  on ? S.done.add(date) : S.done.delete(date);
  syncBooks(); saveState();
}
function setBookRead(n,on){
  on ? S.read.add(n) : S.read.delete(n);
  if(S.sched) S.sched.forEach(x=>{
    if(!x.parts.some(pt=>pt.kind==="book"&&pt.n===n)) return;
    if(on){ if(x.parts.filter(pt=>pt.kind==="book").every(pt=>S.read.has(pt.n))) S.done.add(x.date); }
    else S.done.delete(x.date);
  });
  saveState();
}

  const src = it.kind==="cw" ? COUNTERWEIGHTS.find(c=>c.id===it.id) : BOOKS.find(b=>b.n===it.n);

};

function frTag(b){
  const T=t();
  if(b.fr==="published") return `<span class="tag fr-yes">FR</span>`;
  if(b.fr==="original")  return `<span class="tag fr-yes">FR</span>`;
  if(b.fr==="unverified")return `<span class="tag fr-maybe">FR ?</span>`;
  return `<span class="tag">EN</span>`;
}
function frLine(b){
  const T=t();
  if(b.fr==="original")   return `${T.frOriginal} · ${b.titleFr}`;
  if(b.fr==="published")  return `${T.frEdition} : ${b.titleFr}`;
  if(b.fr==="unverified") return `${T.frUnverified}${b.titleFr?` : ${b.titleFr}`:""}`;
  return T.frNone;
}

      <div class="fld"><span class="eyebrow">${esc(T.cadence)}</span><div class="opts">
        ${[["daily",T.cadDaily],["weekdays",T.cadWeekdays],["weekly",T.cadWeekly]].map(([k,l])=>
          `<button class="opt" data-cad="${k}" aria-pressed="${d.cadence===k}">${esc(l)}</button>`).join("")}
      </div></div>
      <div class="fld"><span class="eyebrow">${esc(T.perSession)}</span><div class="opts">
        ${[1,2,3,5,8].map(h=>`<button class="opt" data-hrs="${h}" aria-pressed="${d.hours===h}">${h} h</button>`).join("")}
      </div></div>
      <div class="calsum">
        <div><div class="k">${esc(T.sessions)}</div><div class="v">${preview.length}</div></div>
        <div><div class="k">${esc(T.finishes)}</div><div class="v">${esc(fmtDate(end))}</div></div>
        <div><div class="k">${esc(T.span)}</div><div class="v">${esc(span)}</div></div>
      </div>
      ${years>=5?`<p class="warn">${esc(T.longWarn)}</p>`:""}
      <button class="cta" id="genBtn">${esc(T.generate)}</button>
    </div>`;
}

function renderCalView(){
  const T=t(), sc=S.sched, st=schedStats(sc);
  if(S.calY===null){
    const nxt=sc.find(x=>!S.done.has(x.date)&&x.date>=todayIso()) || sc.find(x=>x.date>=todayIso()) || sc[0];
    const d=fromIso(nxt.date); S.calY=d.getFullYear(); S.calM=d.getMonth();
  }
  const first=new Date(S.calY,S.calM,1);
  const offset=(first.getDay()+6)%7;                 /* Monday-first */
  const daysIn=new Date(S.calY,S.calM+1,0).getDate();
  const rows=Math.ceil((offset+daysIn)/7);
  const dow=[...Array(7)].map((_,i)=>
    new Date(2024,0,1+i).toLocaleDateString(S.lang==="fr"?"fr-FR":"en-GB",{weekday:"short"}).slice(0,3));
  const monthLabel=first.toLocaleDateString(S.lang==="fr"?"fr-FR":"en-GB",{month:"long",year:"numeric"});

  let cells="";
  for(let i=0;i<rows*7;i++){
    const dayNum=i-offset+1;
    const inMonth=dayNum>=1&&dayNum<=daysIn;
    if(!inMonth){ cells+=`<div class="day out"></div>`; continue; }
    const key=iso(new Date(S.calY,S.calM,dayNum));
    const ses=S.byDate.get(key);
    const isToday=key===todayIso();
    if(!ses){ cells+=`<div class="day${isToday?" today":""}"><span class="dn">${dayNum}</span></div>`; continue; }
    const lead=ses.parts.find(pt=>!pt.marker)||ses.parts[0];
    const extra=ses.parts.filter(pt=>!pt.marker).length-1;
    cells+=`<button class="day has${isToday?" today":""}" data-day="${key}" data-done="${S.done.has(key)}"
        style="--c:${accentOf(lead.s)}">
      <span class="dn">${dayNum}</span>
      <span class="dot"></span>
      <span class="chip">${esc(titleOf(lead))}${extra>0?` +${extra}`:""}</span>
      <span class="dh">${ses.hours}h</span></button>`;
  }

  const monthSes=sc.filter(x=>{const d=fromIso(x.date);return d.getFullYear()===S.calY&&d.getMonth()===S.calM;});
  const agenda=monthSes.length
    ? monthSes.map(x=>{
        const lead=x.parts.find(pt=>!pt.marker)||x.parts[0];
        const extra=x.parts.filter(pt=>!pt.marker).length-1;
        return `<button class="arow" data-day="${x.date}" data-done="${S.done.has(x.date)}" style="--c:${accentOf(lead.s)}">
          <span class="ad">${esc(fmtDate(x.date,{day:"2-digit",month:"short"}))}</span>
          <span class="at">${esc(titleOf(lead))}${extra>0?` <span style="color:var(--faint)">+${extra}</span>`:""}</span>
          <span class="ah">${x.hours}h</span></button>`;}).join("")
    : `<p class="empty">${esc(T.emptyMonth)}</p>`;

  const pct=st.total?Math.round(st.doneN/st.total*100):0;
  const pill=st.delta<0
    ? `<span class="pill bad">${Math.abs(st.delta)} ${esc(T.behindBy)}</span>`
    : `<span class="pill ok">${st.delta>0?`${st.delta} ${esc(T.aheadBy)}`:esc(T.onTrack)}</span>`;

  el("calRoot").innerHTML=`
    <section class="calhead" style="padding-bottom:.4rem">
      <div class="eyebrow">${esc(T.calProgress)}</div>
      <h1 style="font-size:clamp(1.5rem,3.6vw,2.1rem)">${st.doneN} / ${st.total} ${esc(T.sessionsDone)}</h1>
    </section>
    <div class="calsum">
      <div><div class="k">${esc(T.hours)}</div><div class="v">${st.doneH}<small> / ${st.hours}</small></div></div>
      <div><div class="k">${esc(T.finishes)}</div><div class="v">${esc(fmtDate(st.end))}</div></div>
      <div><div class="k">${esc(T.span)}</div><div class="v">${esc(spanLabel(st.start,st.end))}</div></div>
      <div><div class="k">${esc(T.today)}</div><div class="v" style="font-size:1rem;padding-top:.25rem">${pill}</div></div>
    </div>
    <div class="obar" style="margin-bottom:.4rem"><span class="oseg" style="--c:var(--brass);flex:0 0 100%"><i style="--f:${pct}%"></i></span></div>
    <div class="calnav">
      <button class="nav-b" data-mo="-1" aria-label="prev">‹</button>
      <button class="nav-b" data-mo="1" aria-label="next">›</button>
      <span class="mo">${esc(monthLabel)}</span>
      <button class="linkbtn" id="todayBtn">${esc(T.jumpToday)}</button>
      <span style="flex:1"></span>
      <button class="linkbtn" id="regenBtn">${esc(T.regenerate)}</button>
    </div>
    <div class="calgrid">
      ${dow.map(d=>`<div class="dow">${esc(d)}</div>`).join("")}
      ${cells}
    </div>
    <div class="agenda"><h3>${esc(T.thisMonth)}</h3>${agenda}</div>`;
}

function openDay(key){
  const T=t(), ses=S.byDate.get(key); if(!ses) return;
  const done=S.done.has(key);
  const parts=ses.parts.map(pt=>{
    const src=srcOf(pt), acc=accentOf(pt.s);
    if(pt.marker) return `<div class="dpart" style="--c:${acc}">
        <div class="eyebrow" style="color:${acc}">${esc(T.alongside)}</div>
        <div class="dt" style="margin-top:.35rem">${esc(titleOf(pt))}</div>
        <div class="da">${esc(src.author)} · ${esc(T.untimed)}</div></div>`;
    const total=src.h[1];
    return `<div class="dpart" style="--c:${acc}">
      <div class="dt">${esc(titleOf(pt))}${pt.kind==="reread"?` <span class="tag" style="color:${acc};border-color:${acc}">${esc(T.reread)}</span>`:""}</div>
      <div class="da">${esc(src.author)}</div>
      <div class="dr">${esc(T.hoursOf)} ${pt.from+1}–${pt.to} ${esc(T.ofWork)} ${total}</div>
      <div class="prg"><i style="--o:${pt.from/total*100}%;--w:${pt.take/total*100}%"></i></div></div>`;
  }).join("");

  el("sheet").innerHTML=`
    <button class="x" id="xBtn" aria-label="${esc(T.close)}">×</button>
    <div class="body" style="padding:1.5rem">
      <div class="crumb">
        <span class="tag">${esc(T.session)} ${ses.i+1}</span>
        <span class="tag">${ses.hours} ${esc(T.hours)}</span>
        ${done?`<span class="tag" style="color:var(--a2);border-color:var(--a2)">${esc(T.markedDone)}</span>`:""}
      </div>
      <h2>${esc(fmtDate(key,{weekday:"long",day:"numeric",month:"long",year:"numeric"}))}</h2>
      <div style="margin-top:1.2rem">${parts}</div>
      <div class="acts">
        <button class="btn pri" id="dayMark" data-day="${key}" data-on="${done}" style="--c:var(--a2)">
          ${esc(done?T.markedDone:T.markDone)}</button>
      </div>
    </div>`;
  el("ov").dataset.open="true";
  document.body.style.overflow="hidden";
  S.open={day:key};
  el("xBtn").focus();
}

/* ================= MODAL ================= */
function q(b){ return encodeURIComponent(`${b.title} ${b.author}`); }
function openBook(item, isCw){
  const T=t(), acc=accentOf(item.s), n = isCw ? "†" : String(item.n).padStart(2,"0");
  const title = S.lang==="fr" && item.titleFr && item.fr!=="none" ? item.titleFr : item.title;
  const isRead = !isCw && S.read.has(item.n);

  el("sheet").innerHTML = `
    <button class="x" id="xBtn" aria-label="${esc(T.close)}">×</button>
    <div class="sheet-in">
      <div class="tile" style="--c:${acc}">
        <span class="ghost">${esc(n)}</span>
        <span class="rule"></span>
        <span class="tt">${esc(item.title)}</span>
        <span class="ta">${esc(item.author)}</span>
        <span class="ty">${item.year<0?`${Math.abs(item.year)} BCE`:item.year}</span>
      </div>
      <div class="body">
        <div class="crumb">
          ${isCw?`<span class="tag" style="color:${acc};border-color:${acc}">${esc(T.counterweight)}</span>`:`<span class="tag ph">${esc(T.phaseLabel)} ${item.ph}</span>`}
          ${!isCw?`<span class="tag">${item.h[1]} ${esc(T.hours)}</span>`:""}
          ${frTag(item)}
        </div>
        <h2>${esc(title)}</h2>
        <div class="meta">${esc(item.author)}${item.sub?` · <i>${esc(item.sub)}</i>`:""}</div>
        <div class="frline">${esc(frLine(item))}</div>
        <div class="blk"><span class="eyebrow">${esc(T.quickNote)}</span><p>${esc(L(item.note))}</p></div>
        ${item.against?`<div class="blk ag" style="--c:${acc}"><span class="eyebrow">${esc(T.readAgainst)}</span><p>${esc(L(item.against))}</p></div>`:""}
        <div class="acts">
          ${!isCw?`<button class="btn pri" id="mark" data-on="${isRead}" style="--c:${acc}">${esc(isRead?T.markedRead:T.markRead)}</button>`:""}
          <a class="btn" target="_blank" rel="noopener" href="https://openlibrary.org/search?q=${q(item)}">${esc(T.openLibrary)}</a>
          <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=bks&q=${q(item)}">${esc(T.googleBooks)}</a>
          <a class="btn" target="_blank" rel="noopener" href="https://www.amazon.com/s?k=${q(item)}">${esc(T.amazon)}</a>
        </div>
      </div>
    </div>`;

  el("ov").dataset.open="true";
  document.body.style.overflow="hidden";
  S.open = {item, isCw};
  el("xBtn").focus();
}
function closeBook(){
  el("ov").dataset.open="false";
  document.body.style.overflow="";
  S.open=null;
}

/* ================= NAV ================= */
function showTab(name){
  S.tab=name;
  el("tab-browse").style.display   = name==="browse"   ? "block":"none";
  el("tab-calendar").style.display = name==="calendar" ? "block":"none";
  [...el("tabs").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.tab===name));
  if(name==="calendar") renderCalendar();
  window.scrollTo({top:0,behavior:"auto"});
}
function home(){
  el("detail").style.display="none";
  el("home").style.display="block";
  S.sel=null; renderHome();
}

/* ================= EVENTS ================= */
document.addEventListener("click", e=>{
  /* ----- calendar ----- */
  const tb = e.target.closest("#tabs button");
  if(tb){ showTab(tb.dataset.tab); return; }

  const cad = e.target.closest("[data-cad]");
  if(cad){ S.draft.cadence=cad.dataset.cad; renderSetup(); return; }

  const hrsBtn = e.target.closest("[data-hrs]");
  if(hrsBtn){ S.draft.hours=+hrsBtn.dataset.hrs; renderSetup(); return; }

  if(e.target.closest("#genBtn")){
    S.cfg={...S.draft};
    applySchedule(buildSchedule(S.cfg));
    S.calY=null; syncBooks(); saveState(); renderCalendar(); renderHome(); return;
  }
  if(e.target.closest("#regenBtn")){
    S.draft={...S.cfg}; S.sched=null; S.byDate=null; renderCalendar(); return;
  }
  const mo = e.target.closest("[data-mo]");
  if(mo){
    let m=S.calM + (+mo.dataset.mo);
    if(m<0){ m=11; S.calY--; } else if(m>11){ m=0; S.calY++; }
    S.calM=m; renderCalView(); return;
  }
  if(e.target.closest("#todayBtn")){
    const d=new Date(); S.calY=d.getFullYear(); S.calM=d.getMonth(); renderCalView(); return;
  }
  const dm = e.target.closest("#dayMark");
  if(dm){
    const key=dm.dataset.day, on=!S.done.has(key);
    setSessionDone(key,on);
    openDay(key); renderCalView(); renderHome(); return;
  }
  const dayEl = e.target.closest("[data-day]");
  if(dayEl){ openDay(dayEl.dataset.day); return; }

  /* ----- curriculum ----- */
  const band = e.target.closest(".card");
  if(band){ renderDetail(band.dataset.k); return; }

  const bk = e.target.closest(".bk, .srow[data-b]");
  if(bk){ openBook(BOOKS.find(b=>b.n===+bk.dataset.b), false); return; }

  const cw = e.target.closest(".cw, .srow[data-c]");
  if(cw){ openBook(COUNTERWEIGHTS.find(c=>c.id===cw.dataset.c), true); return; }

  if(e.target.closest("#backBtn")){ home(); return; }

  const pg = e.target.closest(".pager button");
  if(pg){ renderDetail(pg.dataset.k); return; }

  if(e.target.closest("#xBtn") || e.target.id==="ov"){ closeBook(); return; }

  const mk = e.target.closest("#mark");
  if(mk && S.open && S.open.item){
    const n=S.open.item.n;
    setBookRead(n, !S.read.has(n));
    const on=S.read.has(n);
    mk.dataset.on=on; mk.textContent = on ? t().markedRead : t().markRead;
    if(S.sel) { const k=S.sel; renderDetail(k); } else renderHome();
    return;
  }

  const th = e.target.closest("#themes button");
  if(th){
    S.theme=th.dataset.t;
    document.documentElement.dataset.theme=S.theme;
    [...el("themes").children].forEach(b=>b.setAttribute("aria-pressed", b===th));
    saveState(); return;
  }

  if(e.target.closest("#lang")){
    S.lang = S.lang==="en" ? "fr" : "en";
    renderStatic();
    if(S.sel) renderDetail(S.sel); else renderHome();
    if(S.tab==="calendar") renderCalendar();
    if(S.open && S.open.item) openBook(S.open.item, S.open.isCw);
    else if(S.open && S.open.day) openDay(S.open.day);
    saveState(); return;
  }

  if(e.target.closest("#vTheme") && S.view!=="theme"){ S.view="theme"; renderStatic(); renderHome(); saveState(); return; }
  if(e.target.closest("#vPhase") && S.view!=="phase"){ S.view="phase"; renderStatic(); renderHome(); saveState(); return; }

  if(e.target.closest("#reset")){
    S.read.clear(); S.done.clear(); saveState();
    if(S.sel) renderDetail(S.sel); else renderHome();
    if(S.tab==="calendar") renderCalendar();
    return; }
});

document.addEventListener("change", e=>{
  if(e.target.id==="fStart"){ S.draft.start=e.target.value||todayIso(); renderSetup(); }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(S.open) closeBook(); else if(S.sel) home(); }
});

/* ================= INIT ================= */
(async ()=>{
  try{ await loadState(); }catch(e){}
  renderStatic(); renderHome(); showTab(S.tab);
})();
</script>
</body>
</html>
